<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SaludPro - Recuperación de Registros</title>

                        "titlebar-height": "44px",
                        "card-padding": "20px",
                        "base": "8px",
                        "card-gap": "16px"

                    fontFamily: {
                        "card-value": ["Inter"],
                        "hero-num": ["Inter"],
                        "label-muted": ["Inter"],
                        "section-title": ["Inter"],
                        "body": ["Inter"]

<body class="bg-surface-container-lowest font-body text-body text-on-background flex items-center justify-center min-h-screen">
<!-- Modal Backdrop / Container -->
<div class="fixed inset-0 bg-on-background/20 flex items-center justify-center z-50">
<!-- Recovery Modal -->
<div class="w-full max-w-[600px] bg-surface-container-lowest border border-outline-variant rounded-lg flex flex-col">
<!-- Header -->
<div class="p-card-padding border-b border-outline-variant">
<div class="flex items-center gap-3 mb-1">
<span class="material-symbols-outlined text-[#d97706]" style="font-size: 24px;">schedule</span>
<h2 class="font-section-title text-section-title text-on-background m-0">Tienes 3 días sin registrar</h2>
</div>
<p class="font-body text-body text-secondary m-0 ml-[36px]">Del 15 al 17 de agosto. Decide qué hacer con cada uno.</p>
</div>
<!-- Body: Day Rows -->
<div class="flex flex-col">
<!-- Day 1 (15 Ago) - Selected Action -->
<div class="flex items-center justify-between p-card-padding bg-surface-container-lowest border-b border-outline-variant">
<div class="flex flex-col">
<span class="font-body text-body font-semibold text-on-background">15 de agosto</span>
<span class="font-label-muted text-label-muted text-secondary">Jueves</span>
</div>
<!-- Segmented Control -->
<div class="flex bg-surface-container-low p-[2px] rounded-DEFAULT border border-outline-variant">
<button class="px-3 py-1 font-label-muted text-label-muted bg-surface-container-lowest border border-primary-container text-primary-container rounded-sm transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-inset">
                            Llenar ahora
                        </button>
<button class="px-3 py-1 font-label-muted text-label-muted text-secondary hover:text-on-background transition-colors focus:outline-none">
                            Marcar fallido
                        </button>
<button class="px-3 py-1 font-label-muted text-label-muted text-secondary hover:text-on-background transition-colors focus:outline-none">
                            Dejar vacío
                        </button>
</div>
</div>
<!-- Day 2 (16 Ago) - Unselected -->
<div class="flex items-center justify-between p-card-padding bg-[#fbfbfa] border-b border-outline-variant">
<div class="flex flex-col">
<span class="font-body text-body font-semibold text-on-background">16 de agosto</span>
<span class="font-label-muted text-label-muted text-secondary">Viernes</span>
</div>
<!-- Segmented Control -->
<div class="flex bg-surface-container-low p-[2px] rounded-DEFAULT border border-outline-variant">
<button class="px-3 py-1 font-label-muted text-label-muted text-secondary hover:text-on-background transition-colors focus:outline-none">
                            Llenar ahora
                        </button>
<button class="px-3 py-1 font-label-muted text-label-muted text-secondary hover:text-on-background transition-colors focus:outline-none">
                            Marcar fallido
                        </button>
<button class="px-3 py-1 font-label-muted text-label-muted bg-surface-container-lowest border border-outline-variant text-on-background rounded-sm transition-colors focus:outline-none">
                            Dejar vacío
                        </button>
</div>
</div>
<!-- Day 3 (17 Ago) - Unselected -->
<div class="flex items-center justify-between p-card-padding bg-surface-container-lowest">
<div class="flex flex-col">
<span class="font-body text-body font-semibold text-on-background">17 de agosto</span>
<span class="font-label-muted text-label-muted text-secondary">Sábado</span>
</div>
<!-- Segmented Control -->
<div class="flex bg-surface-container-low p-[2px] rounded-DEFAULT border border-outline-variant">
<button class="px-3 py-1 font-label-muted text-label-muted text-secondary hover:text-on-background transition-colors focus:outline-none">
                            Llenar ahora
                        </button>
<button class="px-3 py-1 font-label-muted text-label-muted bg-surface-container-lowest border border-outline-variant text-on-background rounded-sm transition-colors focus:outline-none">
                            Marcar fallido
                        </button>
<button class="px-3 py-1 font-label-muted text-label-muted text-secondary hover:text-on-background transition-colors focus:outline-none">
                            Dejar vacío
                        </button>
</div>
</div>
</div>
<!-- Muted Note -->
<div class="px-card-padding pb-4 pt-2 border-t border-outline-variant bg-[#fbfbfa]">
<p class="font-label-muted text-label-muted text-secondary m-0 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                     Los días vacíos no cuentan para tu racha ni la rompen.
                 </p>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-end gap-3 p-card-padding border-t border-outline-variant bg-surface-container-lowest rounded-b-lg">
<button class="px-4 py-2 font-body text-body bg-surface-container-lowest border border-outline-variant text-on-background rounded-DEFAULT hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">
                    Decidir después
                </button>
<button class="px-4 py-2 font-body text-body bg-primary-container text-on-primary rounded-DEFAULT hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">
                    Aplicar
                </button>
</div>
</div>
</div>
