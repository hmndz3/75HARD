<body class="bg-surface text-on-surface font-body text-body antialiased selection:bg-primary-container selection:text-on-primary-container h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Dimmed App Background -->

<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-[640px] rounded-lg border border-outline-variant shadow-2xl flex flex-col z-50 overflow-hidden relative">

<div>
<h2 class="font-section-title text-section-title text-on-surface">Cierre del día · Día 23</h2>
<p class="font-label-muted text-label-muted text-on-surface-variant mt-1">24 Octubre 2023</p>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded">

</button>
</div>

<div class="flex-1 overflow-y-auto px-card-padding py-card-padding">
<!-- Summary List -->

<div class="flex items-center justify-between py-[10px] px-3 border-b border-outline-variant hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-3">

<span class="text-on-surface font-medium">Sueño</span>
</div>
<div class="flex items-center gap-4">
<span class="text-on-surface">6h40</span>
<button class="text-on-surface-variant text-label-muted font-label-muted hover:text-primary transition-colors opacity-0 group-hover:opacity-100">Editar</button>
</div>
</div>
<!-- Row 2: Comidas -->
<div class="flex items-center justify-between py-[10px] px-3 border-b border-outline-variant bg-surface-container-lowest hover:bg-surface-container-low transition-colors group">

<span class="material-symbols-outlined text-[#3a6ea5]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-on-surface font-medium">Comidas</span>
</div>
<div class="flex items-center gap-4">
<span class="text-on-surface">3</span>

<span class="text-on-surface font-medium">Snacks</span>
</div>

<span class="text-on-surface">1</span>
<button class="text-on-surface-variant text-label-muted font-label-muted hover:text-primary transition-colors opacity-0 group-hover:opacity-100">Editar</button>
</div>
</div>

<span class="material-symbols-outlined text-error">cancel</span>
<span class="text-on-surface font-medium">Ejercicio</span>
</div>
<div class="flex items-center gap-2">
<input class="w-24 h-8 bg-surface-container-lowest border border-outline-variant rounded px-2 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-on-surface-variant/50" placeholder="Minutos..." type="text"/>
</div>
</div>

<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="text-on-surface font-medium">Agua</span>
</div>
<div class="flex items-center gap-4">
<span class="text-on-surface">2.4/3L</span>

</div>

</div>

</div>
