<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SaludPro - Morning Check-in</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#1c1c1a",
                        "on-primary-container": "#e4eeff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#ededf3",
                        "surface-tint": "#2b6197",
                        "secondary-container": "#e2dfdd",
                        "on-background": "#191c1f",
                        "surface-dim": "#d9dadf",
                        "on-tertiary-container": "#ffebce",
                        "error-container": "#ffdad6",
                        "primary": "#1b558b",
                        "surface-container-low": "#f3f3f8",
                        "outline-variant": "#c2c7d1",
                        "on-tertiary-fixed": "#271900",
                        "inverse-on-surface": "#f0f0f5",
                        "surface-container-high": "#e7e8ed",
                        "tertiary-fixed-dim": "#f3be5e",
                        "outline": "#727780",
                        "on-surface": "#191c1f",
                        "on-error": "#ffffff",
                        "surface": "#f9f9fe",
                        "on-primary-fixed-variant": "#02497e",
                        "surface-bright": "#f9f9fe",
                        "tertiary-fixed": "#ffdea9",
                        "on-secondary-fixed-variant": "#474745",
                        "on-primary-fixed": "#001c37",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#5e4100",
                        "on-secondary-container": "#636261",
                        "primary-container": "#3a6ea5",
                        "primary-fixed-dim": "#9fcaff",
                        "tertiary-container": "#8d6404",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2e3034",
                        "background": "#f9f9fe",
                        "inverse-primary": "#9fcaff",
                        "on-primary": "#ffffff",
                        "secondary": "#5f5e5d",
                        "surface-variant": "#e2e2e7",
                        "secondary-fixed": "#e5e2e0",
                        "on-surface-variant": "#42474f",
                        "primary-fixed": "#d2e4ff",
                        "secondary-fixed-dim": "#c9c6c4",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary": "#6e4d00",
                        "surface-container-highest": "#e2e2e7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "card-padding": "20px",
                        "titlebar-height": "44px",
                        "card-gap": "16px",
                        "base": "8px",
                        "sidebar-width": "200px"
                    },
                    "fontFamily": {
                        "body": ["Inter"],
                        "label-muted": ["Inter"],
                        "section-title": ["Inter"],
                        "card-value": ["Inter"],
                        "hero-num": ["Inter"]
                    },
                    "fontSize": {
                        "body": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-muted": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "section-title": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "card-value": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "hero-num": ["56px", { "lineHeight": "64px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="h-full bg-background font-body text-body text-on-surface antialiased overflow-hidden">
<!-- Background App Shell (Dimmed) -->
<div class="fixed inset-0 z-0 flex flex-col md:flex-row pointer-events-none opacity-40 grayscale-[20%]">
<!-- SideNav Placeholder -->
<nav class="hidden md:flex flex-col h-full py-4 bg-[#fbfbfa] fixed left-0 top-0 w-[200px] border-r border-outline-variant">
<div class="px-4 mb-8">
<h1 class="font-section-title text-section-title font-bold text-on-surface">SaludPro</h1>
<p class="font-body text-body text-on-surface-variant">Productividad Clínica</p>
</div>
<div class="space-y-1 px-2">
<a class="flex items-center px-3 py-2 bg-surface-container border-l-4 border-primary text-on-surface font-semibold hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mr-3">today</span> Hoy
                </a>
</div>
</nav>
<!-- Main Content Area Placeholder -->
<main class="flex-1 md:ml-[200px] flex flex-col min-h-0 bg-background">
<header class="fixed top-0 right-0 w-full md:w-[calc(100%-200px)] h-[44px] bg-surface flex items-center justify-between px-card-padding border-b border-outline-variant">
</header>
<div class="flex-1 p-8 mt-[44px]">
<!-- Dashboard Skeleton -->
<div class="grid grid-cols-3 gap-card-gap">
<div class="h-64 bg-surface-container-lowest rounded-lg border border-outline-variant"></div>
<div class="h-64 bg-surface-container-lowest rounded-lg border border-outline-variant col-span-2"></div>
</div>
</div>
</main>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 z-40 bg-on-background/30 backdrop-blur-sm transition-opacity flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="w-full max-w-[560px] bg-surface-container-lowest rounded-lg border border-outline-variant shadow-none flex flex-col pointer-events-auto transform transition-all">
<!-- Header -->
<div class="px-card-padding py-6 border-b border-outline-variant">
<h2 class="font-section-title text-section-title text-on-surface">Buenos días, Harry</h2>
<p class="font-label-muted text-label-muted text-on-surface-variant uppercase mt-1">Miércoles 19 de agosto · Día 23</p>
</div>
<!-- Body -->
<div class="p-card-padding flex flex-col gap-6">
<!-- Section 1: Sleep Times -->
<div class="flex gap-4">
<div class="flex-1">
<label class="block font-label-muted text-label-muted text-on-surface-variant mb-2">¿A QUÉ HORA TE DORMISTE?</label>
<input class="w-[220px] h-[48px] px-3 bg-surface-container-lowest border border-outline-variant rounded-[6px] font-card-value text-card-value text-on-surface tabular-nums focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" type="time" value="23:30"/>
</div>
<div class="flex-1">
<label class="block font-label-muted text-label-muted text-on-surface-variant mb-2">¿A QUÉ HORA DESPERTASTE?</label>
<input class="w-[220px] h-[48px] px-3 bg-surface-container-lowest border border-outline-variant rounded-[6px] font-card-value text-card-value text-on-surface tabular-nums focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" type="time" value="06:10"/>
</div>
</div>
<!-- Section 2: Computed Result -->
<div class="bg-[#eaeae7] p-4 rounded-lg flex items-center gap-4 border border-outline-variant">
<div class="font-card-value text-card-value text-on-surface tabular-nums tracking-tight">6<span class="text-xl">h</span> 40<span class="text-xl">min</span></div>
<div class="h-8 w-[1px] bg-outline-variant"></div>
<div class="flex items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-amber-500"></div>
<span class="font-body text-body text-on-surface-variant">20 minutos bajo tu meta de 7 h</span>
</div>
</div>
<!-- Section 3: Weight Input -->
<div>
<label class="block font-label-muted text-label-muted text-on-surface-variant mb-2">PESO (OPCIONAL)</label>
<div class="relative w-[120px]">
<input class="w-full h-[40px] px-3 pr-8 bg-surface-container-lowest border border-outline-variant rounded-[6px] font-body text-body text-on-surface tabular-nums focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors appearance-none" step="0.1" type="number" value="75.4"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-body text-body text-on-surface-variant pointer-events-none">kg</span>
</div>
</div>
<!-- Section 4: Daily State Ratings -->
<div>
<label class="block font-label-muted text-label-muted text-on-surface-variant mb-3">¿CÓMO AMANECISTE?</label>
<div class="flex flex-col gap-3">
<div class="flex items-center gap-4">
<span class="w-16 font-body text-body text-on-surface-variant">Ánimo</span>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">1</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">2</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">3</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border-2 border-primary-container bg-surface-container-lowest text-primary-container font-semibold transition-colors">4</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">5</button>
</div>
</div>
<div class="flex items-center gap-4">
<span class="w-16 font-body text-body text-on-surface-variant">Energía</span>
<div class="flex gap-2">
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">1</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">2</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border-2 border-primary-container bg-surface-container-lowest text-primary-container font-semibold transition-colors">3</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">4</button>
<button class="w-10 h-10 flex items-center justify-center rounded-[4px] border border-outline-variant bg-surface-container-lowest text-on-surface hover:bg-surface-container-low transition-colors font-body">5</button>
</div>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="px-card-padding py-4 border-t border-outline-variant bg-surface-container-lowest rounded-b-lg flex items-center justify-between">
<span class="font-label-muted text-label-muted text-on-surface-variant">Enter para guardar</span>
<div class="flex gap-3">
<button class="px-4 py-2 rounded-[4px] bg-surface-container-lowest border border-outline-variant text-on-surface font-body hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">Después</button>
<button class="px-6 py-2 rounded-[4px] bg-primary-container text-on-primary font-body hover:brightness-110 transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1">Guardar</button>
</div>
</div>
</div>
</div>
</body></html>
