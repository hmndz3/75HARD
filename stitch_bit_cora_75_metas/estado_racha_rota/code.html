<body class="min-h-screen flex items-center justify-center text-on-background">

<!-- SideNav Suppressed as per Semantic Shell Mandate (Linear/Transactional) -->
<main class="w-full max-w-[520px] mx-auto px-card-padding flex flex-col items-center text-center">

<div class="mb-base flex justify-center">
<span class="material-symbols-outlined text-[40px] text-[#ba1a1a]" style="font-variation-settings: 'FILL' 0, 'wght' 300;">
                cancel
            </span>
</div>
<!-- Headers -->
<h1 class="font-card-value text-card-value text-on-background mb-base tracking-tight">
            Se rompió la racha en el día 31
        </h1>
<p class="font-body text-body text-secondary mb-[32px]">
            Fallaste el pilar de ejercicio el 18 de agosto.
        </p>
<!-- Stats Card -->
<div class="w-full bg-[#eaeae7] border border-[#dcdbd7] rounded-lg p-card-padding mb-[24px]">
<h2 class="font-label-muted text-label-muted text-secondary uppercase mb-[16px] border-b border-[#dcdbd7] pb-base">
                Lo que construiste en 31 días
            </h2>
<div class="flex flex-wrap justify-center gap-x-[24px] gap-y-base">
<div class="flex items-center space-x-1">
<span class="font-body text-body text-on-background font-semibold">28</span>
<span class="font-body text-body text-secondary">entrenamientos</span>
</div>
<div class="hidden sm:block text-[#dcdbd7]">·</div>
<div class="flex items-center space-x-1">
<span class="font-body text-body text-on-background font-semibold">7h 12min</span>
<span class="font-body text-body text-secondary">de sueño promedio</span>
</div>
<div class="hidden sm:block text-[#dcdbd7]">·</div>
<div class="flex items-center space-x-1">
<span class="font-body text-body text-[#3a6ea5] font-semibold">-2.8</span>
<span class="font-body text-body text-secondary">kg</span>
</div>
<div class="hidden sm:block text-[#dcdbd7]">·</div>
<div class="flex items-center space-x-1">
<span class="font-body text-body text-on-background font-semibold">214h</span>
<span class="font-body text-body text-secondary">de trabajo</span>
</div>
</div>
</div>
<!-- Muted Text -->
<p class="font-label-muted text-label-muted text-secondary mb-[48px]">
            Nada de esto se borra. Tus gráficas siguen siendo continuas.
        </p>
<!-- Actions -->
<div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-[16px] w-full">
<button class="font-body text-body font-medium text-secondary hover:text-on-background transition-colors px-4 py-2">
                Ver el historial completo
            </button>
<button class="font-body text-body font-medium bg-[#3a6ea5] text-white px-6 py-2 rounded-lg hover:bg-[#2b517a] transition-colors active:opacity-80">
